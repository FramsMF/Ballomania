<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Балломания</title>

<style>
  * {
    box-sizing: border-box;
  }

  :root {
    --background: #03032f;
    --yellow: #ffff00;
    --cell: #345995;
    --hover: #416bad;
    --selected: #459ff5;
    --correct: #66ee94;
    --wrong: #ff7777;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--background);
    color: white;
    font-family: Arial, Helvetica, sans-serif;
  }

  button,
  input {
    font: inherit;
  }

  [hidden] {
    display: none !important;
  }

  button:focus-visible {
    outline: 3px solid white;
    outline-offset: 3px;
  }

  .game {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: 90px auto 1fr;
    grid-template-areas:
      ". score"
      "board question"
      ". finish";

    column-gap: 38px;
    row-gap: 30px;

    width: min(1180px, 100%);
    min-height: 100vh;

    margin: 0 auto;
    padding: 20px 40px 20px 16px;
  }

  /* Счёт */

  .score-area {
    grid-area: score;
    display: flex;
    justify-content: flex-end;
    align-items: flex-start;
    min-width: 0;
  }

  .score-wrap {
    position: relative;
    width: 76%;
    min-width: 200px;
  }

  .score-box {
    min-height: 70px;
    padding: 12px 20px;
    border: 4px solid var(--yellow);
    color: var(--yellow);
    font-size: 34px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }

  .score-change {
    position: absolute;
    right: calc(100% + 14px);
    top: 18px;

    width: max-content;
    font-size: 28px;
    font-weight: 800;

    pointer-events: none;
    animation: score-float 1100ms ease-out forwards;
  }

  .score-change.positive {
    color: var(--correct);
  }

  .score-change.negative {
    color: var(--wrong);
  }

  @keyframes score-float {
    0% {
      opacity: 0;
      transform: translateY(8px);
    }

    20%,
    70% {
      opacity: 1;
    }

    100% {
      opacity: 0;
      transform: translateY(-22px);
    }
  }

  /* Таблица */

  .board-area {
    grid-area: board;

    display: grid;
    grid-template-columns: 40px minmax(0, 1fr);
    gap: 8px;

    align-self: start;
    min-width: 0;
  }

  .row-labels {
    display: grid;
    grid-template-rows: repeat(6, 1fr);
    padding: 5px 0;
  }

  .row-label {
    display: flex;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    grid-template-rows: repeat(6, 1fr);

    aspect-ratio: 5 / 6;

    border: 5px solid var(--yellow);
    background: var(--cell);
  }

  .cell {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    min-width: 0;
    min-height: 0;
    padding: 0;

    border: 1px solid #1c355b;
    background: var(--cell);
    color: white;

    font-size: clamp(15px, 2vw, 21px);
    font-weight: 800;

    cursor: pointer;
    transition: background 150ms ease, opacity 150ms ease;
  }

  .cell:hover:not(:disabled) {
    background: var(--hover);
  }

  .cell.selected {
    background: var(--selected);
  }

  .cell.used {
    opacity: 0.4;
  }

  .cell.used::after {
    position: absolute;
    bottom: 2px;
    right: 5px;
    font-size: 18px;
  }

  .cell.correct::after {
    content: "+";
    color: var(--correct);
  }

  .cell.wrong::after {
    content: "−";
    color: var(--wrong);
  }

  .cell:disabled {
    cursor: default;
  }

  /* Картинка вопроса */

  .question-area {
    grid-area: question;
    align-self: start;
    min-width: 0;
    padding-top: 36px;
  }

  .question-box {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 250px;
    padding: 12px;

    border: 4px solid var(--yellow);
    background: white;
    color: #171717;
  }

  .question-image {
    display: block;
    width: 100%;
    height: auto;
    max-height: 540px;
    object-fit: contain;
  }

  .question-placeholder {
    margin: 0;
    padding: 24px 8px;
    color: #777;
    text-align: center;
    font-size: 15px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /* Ответ */

  .answer-form {
    margin-top: 52px;
  }

  .answer-input {
    display: block;

    width: 100%;
    min-height: 50px;
    padding: 10px 12px;

    border: 4px solid var(--yellow);
    border-radius: 0;
    outline: none;

    background: white;
    color: #171717;

    font-size: 17px;
    font-weight: 700;
  }

  .answer-input::placeholder {
    color: #777;
    opacity: 1;
  }

  .answer-input:focus {
    box-shadow: 0 0 0 2px white;
  }

  .answer-input.correct {
    background: #f1fff4;
    color: #177b36;
  }

  .answer-input.wrong {
    background: #fff4f4;
    color: #a92222;
  }

  .answer-input:disabled {
    opacity: 1;
    -webkit-text-fill-color: currentColor;
  }

  .hint {
    min-height: 18px;
    margin: 10px 0 0;
    color: #c3c3db;
    font-size: 12px;
    line-height: 1.5;
  }

  .message {
    min-height: 18px;
    margin: 8px 0 0;
    color: var(--yellow);
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
  }

  /* Завершение */

  .finish-area {
    grid-area: finish;
    display: flex;
    align-items: flex-end;
    justify-content: flex-end;
    min-height: 90px;
  }

  .finish-button {
    width: 220px;
    min-height: 62px;
    padding: 12px 18px;

    border: 5px solid var(--yellow);
    background: transparent;
    color: var(--yellow);

    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
  }

  .finish-button:hover:not(:disabled) {
    background: #ffff0014;
  }

  .finish-button:disabled {
    opacity: 0.65;
    cursor: default;
  }

  .finish-result {
    width: 100%;
    padding: 12px 0;
    text-align: center;
  }

  .finish-result h1 {
    margin: 0 0 12px;
    font-size: 22px;
  }

  .result-code {
    display: block;
    padding: 12px 8px;
    border: 1px solid #ddd;
    background: #f5f5f5;

    font-family: Consolas, monospace;
    font-size: 17px;
    font-weight: 800;

    overflow-wrap: anywhere;
    user-select: all;
  }

  .copy-button {
    margin-top: 12px;
    padding: 9px 14px;
    border: 0;
    border-radius: 7px;
    background: var(--background);
    color: white;
    cursor: pointer;
  }

  .copy-button:focus-visible {
    outline-color: #171717;
  }

  .code-description {
    font-size: 14px;
    line-height: 1.5;
  }

  .code-warning {
    color: #777;
    font-size: 11px;
    line-height: 1.5;
  }

  @media (max-width: 760px) {
    .game {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto auto auto;
      grid-template-areas:
        "score"
        "board"
        "question"
        "finish";

      gap: 24px;
      padding: 20px 16px 28px;
    }

    .score-wrap {
      width: 60%;
      min-width: 170px;
    }

    .score-box {
      min-height: 60px;
      font-size: 30px;
    }

    .board-area {
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 6px;
    }

    .cell {
      font-size: clamp(14px, 4vw, 21px);
    }

    .question-area {
      padding-top: 0;
    }

    .question-box {
      min-height: 230px;
    }

    .answer-form {
      margin-top: 22px;
    }

    .finish-area {
      min-height: 60px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .cell {
      transition: none;
    }

    .score-change {
      animation: none;
    }
  }
</style>
</head>

<body>
<main class="game" aria-label="Балломания">

  <section class="score-area" aria-label="Ваш счёт">
    <div id="scoreWrap" class="score-wrap">
      <div
        id="score"
        class="score-box"
        aria-live="polite"
        aria-atomic="true"
      >0</div>
    </div>
  </section>

  <section class="board-area" aria-label="Таблица вопросов">
    <div id="rowLabels" class="row-labels"></div>
    <div id="board" class="board"></div>
  </section>

  <section class="question-area" aria-label="Вопрос и ответ">
    <div class="question-box">

      <p id="questionPlaceholder" class="question-placeholder">
        Выберите ячейку на игровом поле
      </p>

      <img
        id="questionImage"
        class="question-image"
        alt="Вопрос"
        hidden
      >

      <div id="finishResult" class="finish-result" hidden>
        <h1>Игра завершена!</h1>

        <p id="finalScore"></p>

        <code id="resultCode" class="result-code" hidden></code>

        <button
          id="copyCode"
          class="copy-button"
          type="button"
          hidden
        >
          Скопировать код
        </button>

        <p id="codeDescription" class="code-description"></p>
        <p id="codeWarning" class="code-warning"></p>
      </div>

    </div>

    <form id="answerForm" class="answer-form">
      <input
        id="answerInput"
        class="answer-input"
        type="text"
        placeholder="Ответ"
        aria-label="Введите ответ"
        aria-describedby="answerHint liveMessage"
        autocomplete="off"
        spellcheck="false"
        enterkeyhint="send"
        disabled
      >

      <p id="answerHint" class="hint">
        Введите ответ и нажмите Enter.
      </p>

      <p
        id="liveMessage"
        class="message"
        role="status"
        aria-live="polite"
      ></p>
    </form>
  </section>

  <div class="finish-area">
    <button id="finishButton" class="finish-button" type="button">
      Завершить
    </button>
  </div>

</main>
